name: Android APK CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git zip unzip \
          openjdk-17-jdk \
          autoconf automake libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev \
          build-essential ccache
        java -version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install buildozer cython==0.29.34
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

    - name: Restore Buildozer and Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
        restore-keys: |
          android-${{ runner.os }}-

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
      shell: bash

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ github.run_number }}
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-log-${{ github.run_number }}
        path: build.log
        if-no-files-found: ignore
        retention-days: 7
